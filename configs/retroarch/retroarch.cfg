# =====================================================
# RETROARCH CONFIGURATION - RETROGAMINGBOX PORTABLE
# Optimizado para Intel Iris Xe / Linux Mint
# =====================================================

# === RUTAS PORTABLES ===
# Cores libretro
libretro_directory = "/home/fabian/RetroGamingBox/cores"
libretro_info_path = "/home/fabian/RetroGamingBox/cores"

# Savestates y Saves
savefile_directory = "/home/fabian/ROMs_Archive/saves"
savestate_directory = "/home/fabian/ROMs_Archive/saves"
savestate_auto_save = "true"
savestate_auto_load = "true"

# Screenshots y Thumbnails
screenshot_directory = "/home/fabian/ROMs_Archive/screenshots"
thumbnails_directory = "/home/fabian/ROMs_Archive/thumbnails"

# Shaders y Overlays
video_shader_dir = "/home/fabian/RetroGamingBox/shaders"
overlay_directory = "/home/fabian/RetroGamingBox/overlays"

# Sistema
system_directory = "/home/fabian/RetroGamingBox/bios"
# =====================================================

# === VIDEO (Optimizado Intel Iris Xe) ===
video_driver = "gl"
video_gl2_shaders_enable = "true"
video_fullscreen = "true"
video_windowed_fullscreen = "false"
video_fullscreen_x = "1920"
video_fullscreen_y = "1080"
video_scale = "3.0"

# Integer scaling para pixel-perfect
video_scale_integer = "true"
video_aspect_ratio_auto = "true"
video_aspect_ratio = "1.778"

# Calidad visual
video_smooth = "false"
video_filter = "Off"
video_filter_dir = "/home/fabian/RetroGamingBox/shaders"

# CRT/LCD Shaders
video_shader_enable = "false"
# Descomenta la línea siguiente para activar shader CRT:
# video_shader = "/home/fabian/RetroGamingBox/shaders/crt/CRT-Royale.glslp"

# Rendimiento
video_threaded = "true"
video_font_size = "16"
video_fps_show = "false"
# =====================================================

# === AUDIO ===
audio_driver = "alsa"
audio_output_rate = "48000"
audio_latency = "64"
audio_sync = "true"
audio_mute = "false"
audio_volume = "0.0"
audio_enable_menu = "true"
# =====================================================

# === INPUT ===
input_driver = "udev"
input_joypad_driver = "udev"
input_max_users = "8"
input_autodetect_enable = "true"

# Hotkeys
input_menu_toggle = "f1"
input_load_state = "f2"
input_save_state = "f3"
input_state_slot_increase = "f4"
input_state_slot_decrease = "f5"
input_rewind = "f6"
input_fast_forward = "f7"
input_pause_toggle = "f8"
input_hold_fast_forward = "lshift"
input_slowmotion = "f9"
input_quit = "escape"

# Teclado principal
input_keyboard_gamepad_enable = "true"
input_player1_joypad_index = "0"
input_player1_a_btn = "z"
input_player1_b_btn = "x"
input_player1_x_btn = "a"
input_player1_y_btn = "s"
input_player1_start_btn = "enter"
input_player1_select_btn = "tab"
input_player1_up_axis = "-1"
input_player1_down_axis = "+1"
input_player1_left_axis = "-0"
input_player1_right_axis = "+0"
input_player1_l2_btn = "q"
input_player1_r2_btn = "w"
input_player1_l3_btn = "e"
input_player1_r3_btn = "r"
# =====================================================

# === MENU ===
menu_driver = "ozone"
menu_show_core_updater = "true"
menu_show_load_disc = "false"
menu_show_load_state = "true"
menu_show_save_state = "true"
menu_show_rewind = "true"
menu_show_shaders = "true"
menu_show_information = "true"
menu_show_configurations = "true"
menu_show_restart_retroarch = "true"
menu_show_quit_retroarch = "true"

# Posición menú
menu_position_x = "2"
menu_position_y = "2"

# Visuales
menu_entry_color_gradient = "true"
menu_color_gradient_direction = "vertical"
menu_color_gradient_preset = "替你"
menu_wallpaper = "/home/fabian/RetroGamingBox/media/wallpaper.png"

# Shader preset (cambiar según pantalla)
# CRT-TV: /home/fabian/RetroGamingBox/shaders/crt/CRT-Royale.glslp
# LCD: /home/fabian/RetroGamingBox/shaders/lcd/LCD-Clean.glslp
# Pixel-Perfect: /home/fabian/RetroGamingBox/shaders/pixel/PIXEL-Perfect.glslp
# =====================================================

# === LOGGING ===
log_dir = "/home/fabian/RetroGamingBox/logs"
logger_dir = "/home/fabian/RetroGamingBox/logs"
log_verbosity = "true"
debug = "false"
# =====================================================

# === RED ===
network_cmd_enable = "true"
network_remote_base_port = "55400"
# =====================================================

# === VARIOS ===
# Frame limit
frame_time_counter_multiply_current = "100"
frame_time_delta = "0.016667"
fastforward_ratio = "3.0"
slowmotion_ratio = "0.5"
# =====================================================