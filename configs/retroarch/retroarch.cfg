# RetroArch configuration for RetroGamingBox
# All paths are relative to the config file location unless otherwise noted

# === BASE DIRECTORY ===
# Two levels up from config file: configs/retroarch/ -> ../../../
base_dir = "../../../"

# === CORE DIRECTORIES ===
content_dir = "{base_dir}roms"           # ROMs directory
savefile_dir = "{base_dir}saves"         # Save files
savestate_dir = "{base_dir}saves"        # Save states
system_dir = "{base_dir}bios"            # BIOS/firmware
libretro_dir = "{base_dir}cores"         # Libretro cores (optional)
video_shader_dir = "{base_dir}shaders"   # Shaders
playlist_dir = "{base_dir}playlists"     # Game playlists
config_dir = "{base_dir}configs/retroarch" # This config's directory

# === CONTENT HISTORY ===
content_history_path = "{base_dir}configs/retroarch/content_history.lpl"
content_history_size = "100"

# === VIDEO SETTINGS (OPTIMIZED FOR INTEL IRIS XE) ===
video_driver = "gl"                      # OpenGL driver (best for Intel)
video_aspect_ratio = "4:3"               # Standard for most retro systems
video_smooth = "false"                   # Disable bilinear filtering (crisp pixels)
video_scale_integer = "true"             # Integer scaling only (no blur)
video_rotation = "0"                     # No rotation
video_refresh_rate = "60.00"             # Standard refresh rate
video_vsync = "true"                     # Enable vertical sync
video_threaded = "true"                  # Use threaded video (better performance)
video_max_swapchain_images = "3"         # Swapchain images
video_font_size = "48"                   # On-screen font size
video_font_enable = "true"               # Enable on-screen font
video_message_pos_x = "0.05"             # Message position X
video_message_pos_y = "0.05"             # Message position Y
# video_font_path = ""                   # Use default font

# === AUDIO SETTINGS ===
audio_driver = "alsa"                    # ALSA audio driver
audio_rate = "48000"                     # Audio sample rate
audio_latency = "64"                     # Audio latency (low for responsiveness)
audio_sync = "true"                      # Enable audio timing sync
audio_max_timing_error = "0"             # Max audio timing error

# === INPUT CONFIGURATION (KEYBOARD-FRIENDLY) ===
input_driver = "udev"                    # UDEV input driver
input_max_users = "4"                    # Support up to 4 players
input_joypad_driver = "udev"             # Use UDEV for joypads
# Player 1 keyboard mapping (SNES-style layout for intuitiveness)
input_player1_btn_a = "x"                # A button
input_player1_btn_b = "z"                # B button
input_player1_btn_y = "a"                # Y button
input_player1_btn_x = "s"                # X button
input_player1_btn_l = "q"                # L shoulder
input_player1_btn_r = "w"                # R shoulder
input_player1_btn_start = "enter"        # Start button
input_player1_btn_select = "rshift"      # Select button (Right Shift)
input_player1_left = "left"              # D-pad left
input_player1_right = "right"            # D-pad right
input_player1_up = "up"                  # D-pad up
input_player1_down = "down"              # D-pad down
# Hotkey configuration (Select+Start to exit, common in retro frontends)
input_enable_hotkey_btn = "select"       # Select enables hotkeys
input_exit_emulator_btn = "start"        # Start exits when hotkey enabled
# Disable other hotkeys to avoid interference during gameplay
input_save_state_btn = "nul"
input_load_state_btn = "nul"
input_state_slot_increase_btn = "nul"
input_state_slot_decrease_btn = "nul"
input_slot_increase_btn = "nul"
input_slot_decrease_btn = "nul"
input_rewind_btn = "nul"
input_hold_fast_forward_btn = "nul"
input_hold_rewind_btn = "nul"
input_toggle_shader_btn = "nul"
input_set_screenshot_btn = "nul"
input_netballflip_players_btn = "nul"
input_netplay_start_btn = "nul"
input_netplay_stop_btn = "nul"
input_netplay_pause_btn = "nul"
input_netplay_increase_rolling_frames_btn = "nul"
input_netplay_decrease_rolling_frames_btn = "nul"
input_mcu_powertoggle_btn = "nul"
input_mcu_reset_btn = "nul"

# === MENU SETTINGS (OZONE MODERN FRONTEND) ===
menu_driver = "ozone"                    # Use Ozone menu driver (modern and touch-friendly)
menu_show_advanced_settings = "true"     # Show advanced settings in menu
menu_color_theme = "100"                 # Dark theme (pleasant for gaming)
menu_cursor_animation = "true"           # Animated cursor
# Ozone-specific settings for grid view (like Batocera)
ozone_menu_tile_view = "true"            # Enable tile/grid view
ozone_menu_layout = "grid"               # Grid layout
ozone_menu_scale_factor = "1.0"          # UI scale factor
ozone_menu_tile_size = "0.25"            # Relative size of tiles
ozone_menu_show_description = "true"     # Show game description below title
ozone_menu_show_rating = "true"          # Show rating if available
ozone_menu_show_players = "true"         # Show player count
ozone_menu_show_genre = "true"           # Show genre
ozone_menu_show_release_date = "true"    # Show release date
ozone_menu_background_color = "00000080" # Semi-transparent black background
ozone_menu_text_color = "FFFFFF"         # White text
ozone_menu_selected_text_color = "FFFF00"# Yellow selected text
ozone_menu_play_count_color = "00FFFF"   # Cyan play count

# === PERFORMANCE & LATENCY SETTINGS ===
run_ahead_enabled = "false"              # Disable run-ahead (not needed for most systems)
frame_delay = "0"                        # No frame delay
rewind_enable = "false"                  # Disable rewind to save CPU
netplay_mode = "disabled"                # Disable netplay
video_gpu_index = "0"                    # Use first GPU (Intel Iris Xe)
video_memory_use_nosync = "false"        # Don't use unsynchronized memory
video_threaded = "true"                  # Already set above, but ensure
video_threaded_ntsc = "false"            # Disable NTSC-specific threading
video_threaded_frames = "2"              # Number of threaded frames
audio_max_timing_skew = "0"              # Audio timing skew

# === THREADING SETTINGS ===
video_threaded = "true"                  # Thread video
audio_threaded = "true"                  # Thread audio
input_threaded = "true"                  # Thread input

# === MISCELLANEOUS ===
pause_nonactive = "true"                 # Pause when window loses focus
screenshot_directory = "{base_dir}media/screenshots" # Screenshots save location
netplay_client_network_tickrate = "60"   # Netplay tickrate